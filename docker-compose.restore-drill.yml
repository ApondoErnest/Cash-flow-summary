# Isolated restore drill stack (Step 117).
# Uses separate Docker volumes + localhost port — never touches production volumes.
# Use: ./deploy/compose-restore-drill.sh up -d

name: cashflow-restore-drill

services:
  nginx:
    ports:
      - "127.0.0.1:${RESTORE_DRILL_HTTP_PORT:-8082}:80"

  app:
    env_file:
      - ./deploy/env/restore-drill.env
    volumes:
      - ./deploy:/var/www/html/deploy:ro
      - storage_data:/var/www/html/storage

  horizon:
    env_file:
      - ./deploy/env/restore-drill.env
    volumes:
      - ./deploy:/var/www/html/deploy:ro
      - storage_data:/var/www/html/storage

  scheduler:
    env_file:
      - ./deploy/env/restore-drill.env
    volumes:
      - ./deploy:/var/www/html/deploy:ro
      - storage_data:/var/www/html/storage

volumes:
  mysql_data:
    name: cashflow-restore-drill_mysql_data
  redis_data:
    name: cashflow-restore-drill_redis_data
  storage_data:
    name: cashflow-restore-drill_storage_data
