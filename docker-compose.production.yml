# Production overrides (VPS — Steps 112–114).
# Use: ./deploy/compose-production.sh up -d
#
# Merged with docker-compose.yml only — never with docker-compose.local.yml.
# Binds nginx to localhost only — host reverse proxy (Step 113) routes the subdomain.

services:
  nginx:
    ports:
      - "127.0.0.1:${HTTP_PORT:-8081}:80"

  app:
    # Secrets via env_file only — do not bind-mount .env (unreadable mode-600/640 breaks PHP-FPM).
    # For key:generate: ./deploy/compose-production.sh run --rm --no-deps \
    #   -v ./deploy/env/production.env:/var/www/html/.env app php artisan key:generate
    env_file:
      - ./deploy/env/production.env
    volumes:
      - ./deploy:/var/www/html/deploy:ro
      - storage_data:/var/www/html/storage

  horizon:
    env_file:
      - ./deploy/env/production.env
    volumes:
      - ./deploy:/var/www/html/deploy:ro
      - storage_data:/var/www/html/storage

  scheduler:
    env_file:
      - ./deploy/env/production.env
    volumes:
      - ./deploy:/var/www/html/deploy:ro
      - storage_data:/var/www/html/storage
